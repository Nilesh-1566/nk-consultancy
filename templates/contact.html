<!DOCTYPE html>
<html lang="mr">
<head>

    <title>संपर्क - NK Consultancy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; padding-bottom: 30px; }
        .header {
            background: linear-gradient(180deg, #090d16 0%, #172033 100%);
            color: #d4af37;
            padding: 50px 16px 20px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
        }
        .header h1 { font-size: 22px; color: #f59e0b; }
        .box {
            background: white;
            max-width: 500px;
            margin: 24px auto;
            padding: 24px;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 1px solid #cbd5e1;
        }
        .item { margin-bottom: 18px; text-align: left; }
        .item label { font-size: 13px; color: #64748b; font-weight: bold; text-transform: uppercase; }
        .item p { font-size: 16px; color: #0f172a; font-weight: 600; margin-top: 4px; }
        .phone-btn {
            display: inline-block;
            background: #0f766e;
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            margin-right: 8px;
            margin-top: 6px;
        }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 12px;
            background: #d4af37;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
