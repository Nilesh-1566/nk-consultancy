<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK Consultancy</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            padding-bottom: 35px;
        }
        /* स्टेटस बार झाकू नये म्हणून ५५px टॉप पॅडिंग */
        .header {
            background: linear-gradient(180deg, #090d16 0%, #172033 100%);
            color: #d4af37;
            padding: 55px 16px 26px;
            text-align: center;
            border-bottom: 3.5px solid #d4af37;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
        }
        /* मोठा व भव्य लोगो */
        .app-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 24px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
            border: 2.5px solid #d4af37;
            background-color: #000;
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #f59e0b;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }
        .header p {
            font-size: 15px;
            color: #f8fafc;
            margin-top: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .container {
            max-width: 650px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 12px;
            border-left: 5px solid #d4af37;
            padding-left: 10px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        .card-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 14px;
            padding: 18px 10px;
            text-decoration: none;
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.06);
            transition: transform 0.12s ease;
        }
        .card-btn:active {
            transform: scale(0.96);
            background-color: #f8fafc;
        }
        .card-btn .icon {
            font-size: 32px;
            margin-bottom: 8px;
        }
        /* मुख्य सेवा - दस्त ड्राफ्ट */
        .card-primary {
            grid-column: span 2;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 14px rgba(184, 134, 11, 0.4);
            padding: 22px 12px;
        }
        .card-primary .icon {
            font-size: 38px;
        }
        .card-primary:active {
            background: linear-gradient(135deg, #b8860b, #996515);
        }
        .footer {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="{{ url_for('static', filename='logo.png') }}" onerror="this.src='/logo.png'; this.onerror=null;" alt="NK Consultancy Logo" class="app-logo">
        <h1>NK CONSULTANCY</h1>
        <p>दस्त नोंदणी व ऑनलाईन सेवा केंद्र</p>
    </div>

    <div class="container">
        
        <div class="section-title">मुख्य सेवा</div>
        <div class="grid-container">
            <!-- दस्त ड्राफ्ट -->
            <a href="/draft" class="card-btn card-primary">
                <span class="icon">📝</span>
                <span>दस्त ड्राफ्ट</span>
            </a>
        </div>

        <div class="section-title">शासकीय व महसूल सेवा</div>
        <div class="grid-container">
            <!-- IGR महाराष्ट्र (सब-पेज उघडेल) -->
            <a href="/igr" class="card-btn">
                <span class="icon">🏛️</span>
                <span>IGR महाराष्ट्र</span>
            </a>

            <!-- सातबारा -->
            <a href="https://digitalsatbara.mahabhumi.gov.in/dslr" target="_blank" class="card-btn">
                <span class="icon">📜</span>
                <span>सातबारा</span>
            </a>

            <!-- रेशनकार्ड -->
            <a href="https://rcms.mahafood.gov.in/" target="_blank" class="card-btn">
                <span class="icon">🌾</span>
                <span>रेशनकार्ड</span>
            </a>

            <!-- ई चावडी -->
            <a href="https://echawadi.mahabhumi.gov.in/" target="_blank" class="card-btn">
                <span class="icon">🏠</span>
                <span>ई चावडी</span>
            </a>

            <!-- ई रेकॉर्ड -->
            <a href="https://aapleabhilekh.mahabhumi.gov.in/erecords" target="_blank" class="card-btn">
                <span class="icon">📁</span>
                <span>ई रेकॉर्ड</span>
            </a>

            <!-- झोन दाखला -->
            <a href="https://rppartplan.maharashtra.gov.in/client/build/" target="_blank" class="card-btn">
                <span class="icon">🗺️</span>
                <span>झोन दाखला</span>
            </a>

            <!-- भूमी अभिलेख -->
            <a href="https://mahabhumi.gov.in/" target="_blank" class="card-btn">
                <span class="icon">📐</span>
                <span>भूमी अभिलेख</span>
            </a>

            <!-- संपर्क -->
            <a href="/contact" class="card-btn">
                <span class="icon">📞</span>
                <span>संपर्क</span>
            </a>
        </div>

        <div class="footer">
            &copy; NK Consultancy | All Rights Reserved
        </div>
    </div>

</body>
</html>
