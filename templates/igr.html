<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGR महाराष्ट्र सेवा - NK Consultancy</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f5f9; padding-bottom: 30px; }
        .header {
            background: linear-gradient(180deg, #090d16 0%, #172033 100%);
            color: #d4af37;
            padding: 50px 16px 20px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
        }
        .header h1 { font-size: 22px; color: #f59e0b; }
        .container { max-width: 650px; margin: 20px auto; padding: 0 16px; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 15px; }
        .card-btn {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 16px 18px;
            text-decoration: none;
            color: #0f172a;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card-btn:active { background-color: #f1f5f9; }
        .icon { font-size: 26px; margin-right: 15px; }
        .back-btn {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 12px;
            background: #d4af37;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>IGR महाराष्ट्र ऑनलाईन सेवा</h1>
        <p style="color:#e2e8f0; font-size:13px; margin-top:4px;">नोंदणी व मुद्रांक विभाग</p>
    </div>
    <div class="container">
        <div class="grid-container">
            <a href="https://easr.igrmaharashtra.gov.in/" target="_blank" class="card-btn">
                <span class="icon">📊</span>
                <span>१) ई-एएसआर (e-ASR)</span>
            </a>
            <a href="https://freesearchigrservice.maharashtra.gov.in/" target="_blank" class="card-btn">
                <span class="icon">🔍</span>
                <span>२) ई-शोध (e-Search)</span>
            </a>
            <a href="https://epraman.igrmaharashtra.gov.in/" target="_blank" class="card-btn">
                <span class="icon">📑</span>
                <span>३) ई-प्रमाण (e-Pramaan)</span>
            </a>
            <a href="https://gras.mahakosh.gov.in/echallan/" target="_blank" class="card-btn">
                <span class="icon">💳</span>
                <span>४) ई-पेमेंट (GRAS Challan)</span>
            </a>
        </div>
        <a href="/" class="back-btn">← मुख्य पानावर परत जा</a>
    </div>
</body>
</html>
