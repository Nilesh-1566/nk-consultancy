<script>
    let counter = 1;

    function addParty(type) {
        const id = type + '_' + counter++;
        const container = document.getElementById(type + '_container');
        const div = document.createElement('div');
        div.className = 'party-box';
        div.id = id;
        div.innerHTML = `
            <button type="button" class="btn-remove" onclick="document.getElementById('${id}').remove()">काढून टाका ✕</button>
            <div class="ocr-upload-box">
                <span style="font-size:13px; font-weight:bold; color:#0369a1;">📷 आधार (दोन्ही बाजू) किंवा पॅन कार्ड अपलोड करा</span><br>
                <input type="file" id="file_${id}" accept="image/*,.pdf" multiple style="display:none;" onchange="handleFiles(this, '${id}')">
                <label for="file_${id}" class="file-label">कार्ड निवडा / फोटो काढा</label>
                <div class="status-ocr" id="status_${id}"></div>
            </div>
            <label>संपूर्ण नाव (मराठीत):</label>
            <input type="text" name="${type}_name[]" class="field_name" required>
            <label>वय व धंदा:</label>
            <input type="text" name="${type}_age_occ[]" class="field_age" placeholder="वय -- वर्ष, धंदा- --">
            <label>पत्ता व पिनकोड (मराठीत):</label>
            <textarea name="${type}_address[]" class="field_address" rows="2" placeholder="रा. --, पिन कोड- --"></textarea>
            <label>आधार क्रमांक:</label>
            <input type="text" name="${type}_aadhar[]" class="field_aadhar" placeholder="xxxx xxxx xxxx">
            <label>पॅन नंबर:</label>
            <input type="text" name="${type}_pan[]" class="field_pan">
            <label>मोबाईल नंबर:</label>
            <input type="text" name="${type}_mobile[]" class="field_mobile">
        `;
        container.appendChild(div);
    }

    function addPayment() {
        const id = 'pay_' + counter++;
        const container = document.getElementById('payment_container');
        const div = document.createElement('div');
        div.className = 'party-box';
        div.id = id;
        div.innerHTML = `
            <button type="button" class="btn-remove" onclick="document.getElementById('${id}').remove()">काढून टाका ✕</button>
            <label>रक्कम रु.:</label>
            <input type="text" name="pay_amt[]" placeholder="उदा. 5,00,000/-" required>
            <label>माध्यम (चेक/DD/RTGS):</label>
            <input type="text" name="pay_mode[]" placeholder="चेक / DD क्रमांक">
            <label>बँक व शाखा नाव:</label>
            <input type="text" name="pay_bank[]" placeholder="बँकेचे नाव व शाखा">
        `;
        container.appendChild(div);
    }

    function formatArea() {
        const unit = document.getElementById('area_unit').value;
        const val = parseFloat(document.getElementById('raw_area').value) || 0;
        let formatted = '';
        if (unit === 'he_r') {
            formatted = val.toFixed(4) + ' हेक्टर-आर';
        } else {
            formatted = val.toFixed(1) + ' चौरस मीटर';
        }
        document.getElementById('final_area').value = formatted;
        document.getElementById('area_preview').innerText = 'दस्त मसुद्यात नोंद: ' + formatted;
    }

    // एका इंग्रजी शब्दाचे शुद्ध मराठीत रूपांतर करणे
    async function convertWordToMarathi(word) {
        if (!word || !/^[A-Za-z]+\$/.test(word)) return word;
        try {
            const res = await fetch(`https://inputtools.google.com/request?text=${encodeURIComponent(word)}&itc=mr-t-i0-und&num=1`);
            const data = await res.json();
            if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1] && data[1][0][1][0]) {
                return data[1][0][1][0];
            }
        } catch (e) {
            console.error("Transliteration error:", e);
        }
        return word;
    }

    // संपूर्ण नाव किंवा पत्त्याचे अचूक मराठीत रूपांतर करणे
    async function convertSentenceToMarathi(str) {
        if (!str || str.trim() === '') return str;
        const words = str.trim().split(/\s+/);
        const convertedWords = await Promise.all(words.map(async (w) => {
            const clean = w.replace(/[^A-Za-z]/g, '');
            if (clean.length < 2) return w;
            
            const lower = clean.toLowerCase();
            if (lower === 'at') return 'मु.';
            if (lower === 'post' || lower === 'po') return 'पो.';
            if (lower === 'tal' || lower === 'taluka') return 'ता.';
            if (lower === 'dist' || lower === 'district') return 'जि.';
            if (lower === 'near') return 'जवळ';
            if (lower === 'road') return 'मार्ग';
            if (lower === 'lane') return 'गल्ली';
            if (lower === 'maharashtra') return 'महाराष्ट्र';
            
            return await convertWordToMarathi(clean);
        }));
        return convertedWords.join(' ');
    }

    // फोटो स्पष्ट दिसण्यासाठी रिसाईझ व ऑप्टिमाइझ करणे
    function preprocessImage(file) {
        return new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width;
                let h = img.height;
                const maxDim = 1500;
                if (w > maxDim || h > maxDim) {
                    if (w > h) {
                        h = Math.round((h * maxDim) / w);
                        w = maxDim;
                    } else {
                        w = Math.round((w * maxDim) / h);
                        h = maxDim;
                    }
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, w, h);
                canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.92);
            };
            img.src = URL.createObjectURL(file);
        });
    }

    // कार्ड फाइल्स प्रोसेस करणे
    async function handleFiles(input, boxId) {
        if (!input.files || input.files.length === 0) return;
        const files = Array.from(input.files);
        const status = document.getElementById('status_' + boxId);
        const box = document.getElementById(boxId);

        status.innerText = `स्कॅन सुरू आहे... (${files.length} फोटो)`;

        let combinedText = '';

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.innerText = `फोटो ${i + 1} वाचत आहे... कृपया थांबा.`;

            try {
                let imageBlob = file;
                if (file.type === 'application/pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                    const page = await pdf.getPage(1);
                    const viewport = page.getViewport({scale: 1.5});
                    const canvas = document.createElement('canvas');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    await page.render({canvasContext: canvas.getContext('2d'), viewport: viewport}).promise;
                    imageBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg'));
                } else {
                    imageBlob = await preprocessImage(file);
                }

                const res = await Tesseract.recognize(imageBlob, 'eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            status.innerText = `वाचत आहे: ${Math.round(m.progress * 100)}%`;
                        }
                    }
                });
                combinedText += '\n' + res.data.text;
            } catch (e) {
                console.error('File OCR error:', e);
            }
        }

        status.innerText = '✅ माहिती वाचली! शुद्ध मराठीत रूपांतर होत आहे...';
        await parseAndFillDataSmart(combinedText, box);
        status.innerText = '✅ मराठी नाव व पत्ता यशस्वीरीत्या भरला!';
    }

    // अचूक नाव, पत्ता आणि तपशील शोधणारे मुख्य फंक्शन
    async function parseAndFillDataSmart(text, box) {
        const rawLines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        // १. PAN क्रमांक
        const panMatch = text.match(/[A-Z]{5}[0-9]{4}[A-Z]{1}/);
        if (panMatch && !box.querySelector('.field_pan').value) {
            box.querySelector('.field_pan').value = panMatch[0];
        }

        // २. आधार क्रमांक
        const aadharMatch = text.match(/\b\d{4}\s?\d{4}\s?\d{4}\b/);
        if (aadharMatch && !box.querySelector('.field_aadhar').value) {
            box.querySelector('.field_aadhar').value = aadharMatch[0];
        }

        // ३. मोबाईल नंबर
        const mobMatch = text.match(/\b[6-9]\d{9}\b/);
        if (mobMatch && !box.querySelector('.field_mobile').value) {
            box.querySelector('.field_mobile').value = mobMatch[0];
        }

        // ४. जन्म तारीख व वय
        const currentYear = 2026;
        let foundDobLineIndex = -1;
        const dobMatch = text.match(/(?:DOB|Birth|Year)[:\s/]*([0-9]{4}|[0-9]{2}[/-][0-9]{2}[/-][0-9]{4})/i);
        
        for (let i = 0; i < rawLines.length; i++) {
            if (/(?:DOB|Birth|Year|\d{2}[\/\-]\d{2}[\/\-]\d{4})/i.test(rawLines[i])) {
                foundDobLineIndex = i;
                break;
            }
        }

        if (dobMatch) {
            let yearStr = dobMatch[1];
            if (yearStr.length > 4) yearStr = yearStr.slice(-4);
            const y = parseInt(yearStr);
            if (y > 1920 && y <= currentYear) {
                box.querySelector('.field_age').value = `वय ${currentYear - y} वर्ष, धंदा- घरकाम`;
            }
        }

        // ५. संपूर्ण इंग्रजी नाव शोधणे (Title Case: Aanandi Pandurang Namde)
        let detectedEnglishName = '';

        if (foundDobLineIndex > 0) {
            for (let k = foundDobLineIndex - 1; k >= Math.max(0, foundDobLineIndex - 3); k--) {
                const l = rawLines[k].replace(/[^A-Za-z\s]/g, '').trim();
                const words = l.split(/\s+/).filter(w => w.length >= 2);
                const isTitleCase = words.length >= 2 && words.every(w => /^[A-Z][a-z]+\$/.test(w));
                if (isTitleCase && words.length <= 4 && !/Government|India|Authority/i.test(l)) {
                    detectedEnglishName = l;
                    break;
                }
            }
        }

        if (!detectedEnglishName) {
            for (let i = 0; i < rawLines.length; i++) {
                const l = rawLines[i].replace(/[^A-Za-z\s]/g, '').trim();
                if (/Government|India|Unique|Identification|Authority|DOB|Father|Female|Male|Income|Tax|Address/i.test(l)) continue;
                const words = l.split(/\s+/).filter(w => w.length >= 2);
                const isTitleCase = words.length >= 2 && words.every(w => /^[A-Z][a-z]+\$/.test(w));
                if (isTitleCase && words.length <= 4 && l.length >= 7) {
                    detectedEnglishName = l;
                    break;
                }
            }
        }

        // नाव मराठीत रूपांतरित करणे
        if (detectedEnglishName) {
            const marathiName = await convertSentenceToMarathi(detectedEnglishName);
            box.querySelector('.field_name').value = marathiName;
        }

        // ६. पत्ता शोधणे (Address: W/O: Pandurang Bhau Namde...)
        const pinMatch = text.match(/\b(4\d{5})\b/);
        let addressParts = [];
        let readingAddress = false;

        for (let i = 0; i < rawLines.length; i++) {
            const line = rawLines[i];
            if (/Address[:\s]/i.test(line) || /W\/O|S\/O|D\/O|C\/O/i.test(line)) {
                readingAddress = true;
            }
            if (readingAddress) {
                let clean = line.replace(/.*Address[:\s]*/i, '').trim();
                clean = clean.replace(/[^A-Za-z0-9\s,\/\-]/g, '').trim();
                if (clean.length > 2 && !/Unique|Authority|www|uidai/i.test(clean)) {
                    addressParts.push(clean);
                }
                if (/\b(4\d{5})\b/.test(line) || addressParts.length >= 3) {
                    break;
                }
            }
        }

        if (addressParts.length > 0) {
            const fullRaw = addressParts.join(', ');
            const marathiAddr = await convertSentenceToMarathi(fullRaw);
            let finalAddr = marathiAddr;
            if (pinMatch && !finalAddr.includes(pinMatch[0])) {
                finalAddr += ', पिन कोड- ' + pinMatch[0];
            }
            box.querySelector('.field_address').value = finalAddr;
        } else if (pinMatch && !box.querySelector('.field_address').value) {
            box.querySelector('.field_address').value = 'पिन कोड- ' + pinMatch[0];
        }
    }
</script>
